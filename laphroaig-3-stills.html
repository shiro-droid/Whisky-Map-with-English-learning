{id:"mash",x:18,y:47,icon:"🌡",label:"糖化槽",kind:"工序 · Mashing",title:"把糖洗出来",

  en:["This is the mash tun. The malt is ground down and mixed with hot water in here.",

{id:"wash",x:41,y:38,icon:"🫧",label:"发酵槽",kind:"工序 · Fermentation",title:"它在里面自己响",
 passage:{
  en:["These are the washbacks. We add yeast, and then we leave it alone for about three days.",
      "Come in here on the second day and you'll hear it working. It hisses, and it climbs up the sides.",
      "The yeast eats the sugar and gives off alcohol, carbon dioxide and a lot of heat.",
      "What's in there at the end is called wash. It's about eight per cent, and it really does taste like beer.",
      "Sour beer, mind. Nobody's ever asked for a second glass."],
  zh:"这些是发酵槽。我们加酵母，然后放着不管，大约三天。<br>第二天进来你能听见它在工作。它嘶嘶响，还会顺着桶壁往上爬。<br>酵母吃糖，放出酒精、二氧化碳和大量的热。<br>最后里面的东西叫 wash（酒醪）。大约八度，而且它<b>确实</b>尝起来像啤酒。<br>酸啤酒，注意。从来没有人要过第二杯。",
  tip:"<b>it really does taste like beer</b> ——这个 does 不是错，是<b>强调</b>。下面讲。"},
 build(b){

   {w:"yeast",ipa:"/jiːst/",zh:"酵母",ja:"酵母／イースト"},

{id:"stills",x:70,y:40,icon:"🥃",label:"蒸馏器",kind:"设备 · The stills",title:"七个，而且配不成对",

  en:["Seven stills: three wash stills and four spirit stills.",
      "That's an odd arrangement — most distilleries pair them up. Ours have never matched, and we've never changed it.",
      "The shape matters more than you'd think.",
      "A tall still lets only the lightest vapour over the top. A short, fat one lets more through, and that gives you a heavier spirit.",
      "And copper is not just for looks. It strips the sulphur out.",
      "In steel you'd get something you couldn't drink."],
  zh:"七个蒸馏器：三个初馏器，四个再馏器。<br>这是个奇怪的配置——大部分酒厂是成对的。我们的从来就配不成对，而我们也从来没改过。<br>形状比你想的重要得多。<br>高的蒸馏器只让最轻的蒸汽翻过顶部。矮胖的让更多东西过去，给你更重的酒体。<br>而铜不只是为了好看。它把硫剥掉。<br>用不锈钢的话，你会得到一种没法喝的东西。",
  tip:"注意 <b>odd</b> 这里是「奇数」和「奇怪」的双关——七个本来就是奇数，配置也确实奇怪。"},

  b.appendChild(E("div","box flat","<div class='small'><b>为什么形状决定味道：</b>蒸汽在铜壁上冷凝又蒸发，这叫 <b>reflux（回流）</b>。蒸馏器越高，回流越多，只有最轻的分子能翻过顶部 → 酒体轻盈。矮胖的回流少 → 酒体厚重油润。<br><br><b>所以 Laphroaig 的七个不对称蒸馏器，本身就是它风味的一部分</b>——换掉任何一个，酒就不是它了。这也是酒厂修蒸馏器时会照着旧的凹痕一起复制的原因。</div>"));

{id:"safe",x:87,y:66,icon:"🔒",label:"取酒箱",kind:"核心 · The cut",title:"一个上锁的黄铜箱子",
 passage:{cap:"English first · 书面说明体",
  en:["This brass and glass box is the spirit safe, and it is locked.",
      "For nearly two hundred years the excise officer held the only key, and the distiller could not touch his own spirit.",
      "The stillman works through it by sight alone. He watches the spirit run, and he decides where to make the cut.",
      "The first part off the still is too harsh; the last part is oily and dull. Neither of them goes into the cask.",
      "Only the middle is kept, and that middle is called the heart.",
      "When to cut, and where — that is the one decision that makes a distillery taste like itself."],
  zh:"这个黄铜加玻璃的箱子叫 spirit safe（取酒箱），而且它是锁着的。<br>将近两百年里，钥匙只有税务官有一把，酿酒师碰不到自己酿的酒。<br>蒸馏师只能隔着玻璃靠眼睛判断。他看着酒液流过，决定在哪里下刀。<br>最先流出来的那段太冲；最后那段油腻而沉闷。两段都不进桶。<br>只有中间那段留下来，那一段叫 <b>the heart</b>（酒心）。<br>什么时候切、切在哪里——这是让一家酒厂尝起来像它自己的那一个决定。",
  tip:"最后一句又是<b>段 1 白墙、段 2 宝塔顶</b>那个收尾家族：破折号 + 一句抽象的总结。"},
 build(b){
  b.appendChild(E("h3",null,"三段酒的英文名"));
  b.appendChild(E("div","box","<p class='zh' style='margin:0'><b>foreshots</b> /ˈfɔːʃɒts/ ——最先流出的，酒精度极高、含甲醇和杂味，太冲。也叫 <b>the heads</b>。<br><br><b>the heart</b> ——中间那段，唯一进桶的。也叫 <b>the middle cut</b>。<br><br><b>feints</b> /feɪnts/ ——最后流出的，油腻、沉闷。也叫 <b>the tails</b>。<br><br>前后两段不会浪费，会回到下一批重蒸。<b>「切在哪里」是每家酒厂最核心的机密</b>——同样的麦芽、同样的桶，切法不同，酒就完全不同。</p>"));
  b.appendChild(E("h3",null,"为什么箱子要上锁：一段税务史"));
  b.appendChild(E("div","box flat","<div class='small'>1823 年之后，英国政府对威士忌按产量征税，于是派 <b>excise officer</b>（税务官）常驻每一家酒厂，钥匙只有他有。酿酒师只能<b>隔着玻璃看</b>，用箱子上的阀门取样，全靠眼睛判断酒液的清浊和挂杯。<br><br>这个制度到 1983 年才取消，但<b>所有酒厂都保留了这个箱子</b>——因为一代代蒸馏师就是这么练出来的。<br><br>顺带：<b>excise</b> /ˈeksaɪz/ ＝ 国内消费税（跟进口关税 customs 相对）。英国税务局至今叫 <b>HMRC</b>（HM Revenue &amp; Customs）。</div>"));
  b.appendChild(E("h3",null,"by sight alone"));
  b.appendChild(E("div","box flat","<div class='small'><b>名词 + alone</b> ＝ 仅凭……<br>· <i>by sight alone</i> 仅凭肉眼<br>· <i>by memory alone</i> 全凭记忆<br>· <i>Time alone will tell.</i> 只有时间能证明<br><br>注意语序：<b>alone 放在名词后面</b>，不是前面。放前面（<i>alone by sight</i>）就完全不对了。<br><br>这个小结构很短，但一用就显得英语成熟。</div>"));
  WM.vocab(b,[
   {w:"spirit safe",ipa:"—",zh:"取酒箱",ja:"スピリッツセーフ"},
   {w:"the cut",ipa:"/kʌt/",zh:"切取点（决定留哪一段）",ja:"カットポイント"},
   {w:"foreshots / heads",ipa:"/ˈfɔːʃɒts/",zh:"酒头",ja:"ヘッド／前留"},
   {w:"the heart",ipa:"/hɑːt/",zh:"酒心（中段，唯一进桶）",ja:"ハート／中留"},
   {w:"feints / tails",ipa:"/feɪnts/",zh:"酒尾",ja:"テール／後留"},
   {w:"excise officer",ipa:"/ˈeksaɪz/",zh:"税务官",ja:"収税官"}
  ]);
 },
 check:{q:"<b>the heart</b> 指的是什么？",
  opts:["中段酒液，唯一进桶的那一段","蒸馏器最中心的部位","酒厂最古老的那栋楼","酒心形状的取酒阀"],a:0,
  exp:"三段：<b>foreshots（酒头，太冲）→ heart（酒心，留下）→ feints（酒尾，油腻）</b>。只有 heart 进桶。<br><br>原文那句 <i>Neither of them goes into the cask</i> 值得注意：<b>neither of them 后面用单数动词 goes</b>——neither/either/each 在正式英语里都当单数。<br><br>而最后一句 <i>the one decision that makes a distillery taste like itself</i>，<b>the one</b>（不是 the only）＝「就是那一个」，比 only 更有分量。"}},

{id:"numbers",x:30,y:16,icon:"📊",label:"数字",kind:"听力专项 · Numbers",title:"数字是听力里最容易崩的地方",
 passage:{
  en:["The wash goes in at about eight per cent, and it comes off the second still at around seventy.",
      "We cut it back to sixty-three point five before it goes into the cask.",
      "The ten-year-old is bottled at forty. The Quarter Cask is forty-eight.",
      "Cask strength varies with the year, but it usually lands somewhere in the fifties.",
      "And a cask loses about two per cent a year to evaporation — the angels' share.",
      "Over ten years, that adds up."],
  zh:"酒醪进去大约八度，从第二个蒸馏器出来大约七十度。<br>进桶之前我们把它降到 63.5 度。<br>10 年款按 40 度装瓶。Quarter Cask 是 48 度。<br>桶强每年不一样，但通常落在五十几度。<br>而一个桶每年因蒸发损失大约百分之二——这就是「天使的份额」。<br>十年下来，那可不是小数目。",
  tip:"整段全是数字。<b>先不看文本听三遍</b>，你会发现听不清的永远是数字，不是单词。"},
 build(b){
  b.appendChild(E("h3",null,"小数点怎么念"));
  b.appendChild(E("div","box","<p class='zh' style='margin:0'><b>63.5</b> → <i>sixty-three <b>point</b> five</i><br><b>0.5</b> → <i><b>nought</b> point five</i>（英式）／<i>zero point five</i>（美式）<br><b>58.4%</b> → <i>fifty-eight point four per cent</i><br><br><b>规则：小数点后一位一位念</b>，不合成数字。<br>· 3.14 → three point <b>one four</b>（不是 fourteen）<br><br>威士忌度数几乎都是一位小数，这个念法你会用一辈子。</p>"));
  b.appendChild(E("h3",null,"per cent 的三个坑"));
  b.appendChild(E("div","box flat","<div class='small'>① <b>永远不加 s</b>：eight per cent ✓ / eight per cent<s>s</s> ✗<br>② 英式写成两个词 <b>per cent</b>，美式一个词 percent。名词形式是 <b>percentage</b>。<br>③ 说酒的度数时，英国人经常<b>把 per cent 省掉</b>：<i>It's bottled at forty.</i>「装瓶 40 度」——数字后面什么都不加。<b>这个省略会让你听懵，但一旦知道就再也不会错。</b></div>"));
  b.appendChild(E("h3",null,"in the fifties：一个模糊范围的说法"));
  b.appendChild(E("div","box flat","<div class='small'><b>in the fifties</b> ＝ 五十几（50–59）<br>· <i>It lands somewhere in the fifties.</i> 落在五十几度<br>· <i>He's in his forties.</i> 他四十几岁<br>· <i>Temperatures in the twenties.</i> 二十几度<br><br><b>数字 + s + 定冠词 the</b>，专门表示一个十位区间。中文说「五十几」很自然，英语必须用这个结构，直译不出来。</div>"));
  b.appendChild(E("h3",null,"另外三个动词"));
  WM.chips(b,[
   {en:"We cut it back to sixty-three point five.",zh:"我们把它降到 63.5。｜ cut back to ＝ 降到"},
   {en:"It varies with the year.",zh:"每年不一样。｜ vary with ＝ 随……变化"},
   {en:"It lands somewhere in the fifties.",zh:"落在五十几。｜ land ＝ 最终落在（很口语）"},
   {en:"Over ten years, that adds up.",zh:"十年下来，累积起来就不少了。｜ add up ＝ 累积、积少成多"},
   {en:"the angels' share",zh:"天使的份额（陈年蒸发损耗）｜ 注意撇号在 s 后面，天使是复数"}
  ]);
 },
 check:{q:"<b>63.5%</b> 英语怎么念？",
  opts:["sixty-three point five per cent","sixty-three comma five per cent","sixty-three point fifth per cent","sixty-three and a half per cents"],a:0,
  exp:"小数点念 <b>point</b>（不是 comma——那是德语、法语、西班牙语的习惯，英语从不用）。<br><br>小数点后<b>一位一位念</b>，用基数词（five），不是序数（fifth）。<br><br><b>per cent 永远不加 s。</b><br><br>而 D 的 <i>and a half</i> 虽然数学上对（63.5 ＝ 63 又二分之一），但说酒精度<b>没人这么讲</b>——酒标上是 63.5%，就念 point five。"}},

{id:"confirm",x:57,y:70,icon:"❓",label:"15 还是 50",kind:"痛点专项 · Confirming",title:"fifteen 和 fifty 谁都分不清",
 passage:{
  en:["Sorry — was that fifty or fifteen?",
      "Don't be embarrassed. I ask people that myself. The two sound almost the same, and it's noisy in here.",
      "The trick is the stress. fifTEEN has it at the end; FIFty has it at the start.",
      "And if you're still not sure, just say the number back to them: 'sixty-three, did you say?'",
      "If it's a name or a word you don't know, ask them to spell it.",
      "Nobody has ever minded. Not once."],
  zh:"抱歉——刚才是 50 还是 15？<br>别不好意思。这个问题我自己也问别人。这两个听起来几乎一样，而且这里很吵。<br>诀窍在重音。fifTEEN 重音在后面；FIFty 重音在前面。<br>要是还不确定，就把数字复述回去：「63，你是说吗？」<br>要是遇到人名或者不认识的词，就请对方拼出来。<br>从来没有人介意过。一次都没有。",
  tip:"这一格跟段 2 的「敢提问」是一对：<b>那一格解决「不敢开口」，这一格解决「听到了但不确定」。</b>"},
 build(b){
  b.appendChild(E("h3",null,"-teen 和 -ty 的重音"));
  b.appendChild(E("div","box","<p class='zh' style='margin:0'>这是英语听力里最经典的一对陷阱，而区别<b>只在重音</b>：<br><br>· <b>thirTEEN</b> / <b>THIRty</b><br>· <b>fourTEEN</b> / <b>FORty</b><br>· <b>fifTEEN</b> / <b>FIFty</b><br>· <b>sixTEEN</b> / <b>SIXty</b><br><br><b>-teen 重音在后，-ty 重音在前。</b><br><br>但现实是：说快了、环境吵，母语者自己也分不清——<b>所以他们的解决办法不是听得更准，是复述确认。</b></p>"));
  const P=["thirteen or thirty","fourteen or forty","fifteen or fifty","sixteen or sixty","seventeen or seventy"];
  const r=E("div","btnrow");
  P.forEach(x=>{const btn=E("button","btn sm","▶︎ "+x);btn.onclick=()=>WM.speak(x,0.62);r.appendChild(btn)});
  b.appendChild(E("p","small","点一下慢速听对比："));
  b.appendChild(r);
  b.appendChild(E("h3",null,"四句确认，学会就再也不慌"));
  WM.chips(b,[
   {en:"Sorry, was that fifteen or fifty?",zh:"抱歉，是 15 还是 50？｜ 直接给两个选项，最快"},
   {en:"Sixty-three, did you say?",zh:"63，你是说吗？｜ 把数字复述回去，最稳"},
   {en:"Sorry, how do you spell that?",zh:"抱歉，那怎么拼？｜ 人名地名专用"},
   {en:"Could you write that down for me?",zh:"能帮我写下来吗？｜ 终极方案，没人会拒绝"}
  ]);
  b.appendChild(E("h3",null,"完整走一遍"));
  WM.dialogue(b,[
   {who:"g",en:"…and it comes off the still at about seventy per cent.",zh:"……然后从蒸馏器出来大约七十度。"},
   {who:"y",en:"<mark class='k'>Sorry, was that seventeen or seventy?</mark>",zh:"抱歉，是 17 还是 70？"},
   {who:"g",en:"Seventy. Seven-oh.",zh:"七十。七、零。"},
   {who:"y",en:"<mark class='k'>Seventy, right.</mark> And then you cut it back to—",zh:"七十，好。然后你们把它降到——"},
   {who:"g",en:"Sixty-three point five.",zh:"63.5。"},
   {who:"y",en:"<mark class='k'>Sixty-three point five, did you say?</mark>",zh:"63.5，你是说吗？"},
   {who:"g",en:"Aye, that's the one. Standard filling strength.",zh:"对，就是它。标准入桶度数。"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>注意他怎么回答的：Seventy. Seven-oh.</b><br><br>母语者知道数字容易混，所以会<b>主动再拆一遍</b>：<i>Seven-oh</i>（七、零）。同理 15 会说成 <i>one-five</i>，50 会说成 <i>five-oh</i>。<br><br><b>你也可以这么做</b>——报手机号、房间号、预约编号的时候，一位一位念比整体念安全得多。（英式把 0 念作 <b>oh</b> 或 <b>nought</b>，不念 zero。）</div>"));
 },
 check:{q:"<b>fifTEEN</b> 和 <b>FIFty</b> 的区别在哪？",
  opts:["重音位置：-teen 在后，-ty 在前","元音长度：teen 比 ty 长","第一个音不同","没有区别，全靠上下文"],a:0,
  exp:"<b>-teen 重音在词尾，-ty 重音在词首。</b>这是唯一可靠的区别。<br><br>但更重要的是这一格真正的结论：<b>母语者自己也常听不清，所以他们靠复述确认，而不是靠听力更强。</b><br><br>你需要的不是练到能分辨，而是养成一个习惯：<b>凡是重要数字，一律复述一遍。</b><i>Sixty-three, did you say?</i> 这一句能帮你避开无数麻烦。"}},
