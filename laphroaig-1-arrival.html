{id:"email",x:15,y:88,icon:"📱",label:"预约邮件",kind:"书面英语 · The confirmation",title:"确认邮件长什么样",

 build(b){
  b.appendChild(E("h3",null,"正式邮件体的三个标志"));

{id:"road",x:23,y:71,icon:"🛣",label:"单车道",kind:"实用 · Single track road",title:"艾雷岛的路只有一条车道",
 passage:{
  en:["The road to the distillery is single track.",
      "That means one lane, shared in both directions.",

      "If a car comes the other way, pull into the passing place on your left, or stop opposite the one on your right.",

      "And if somebody's behind you and going faster, pull in and let them past.",
      "Nobody's in a hurry here, but nobody likes being stuck behind a tourist either."],

  tip:"艾雷岛<b>绝大部分公路都是单车道</b>。这一段是真会用上的攻略，不是背景知识。"},
 build(b){

{id:"weather",x:70,y:14,icon:"🌧",label:"天气",kind:"地道 · Scottish weather",title:"dreich 这个词没有英语对应",
 passage:{
  en:["It's a bit dreich today.",

      "It's not really raining, mind. This is smirr: rain so fine you don't notice it until you're soaked through.",
      "Give it twenty minutes and it might be sunny. Four seasons in one day, as they say.",
      "You'll want a jacket, but you'll not want an umbrella.",
      "The wind will have it off you before you get to the door."],
  zh:"今天有点 dreich。<br>这是个苏格兰词——灰、潮、暗，三样一起。英语里没有对应的词。<br>不过也不算真的在下雨。这叫 smirr：细到你察觉不到，等发现时已经湿透了。<br>再等二十分钟说不定就出太阳了。人家说的「一天四季」。<br>你会需要一件外套，但你不会想要伞。<br>还没走到门口，风就把它从你手里掀走了。",
  tip:"这一段有两个<b>回收</b>：<i>mind</i>（段 5 的 Just a drop, mind）和苏格兰否定 <i>you'll not</i>。听出来了吗？"},
 build(b){
  b.appendChild(E("h3",null,"两个词，苏格兰以外没人用"));
  b.appendChild(E("div","box","<p class='en' style='margin:0;font-size:19px'>dreich</p><p class='small' style='margin:3px 0 0'>/driːx/ 读「德里赫」，最后是喉音（跟 loch 的 ch 一样）<br><b>灰 + 潮 + 阴沉 + 让人提不起劲</b>——四个意思压在一个词里。苏格兰人认为这是他们最有用的词。</p>"));
  b.appendChild(E("div","box","<p class='en' style='margin:0;font-size:19px'>smirr</p><p class='small' style='margin:3px 0 0'>/smɪr/ <b>极细的飘雨</b>，不是 drizzle（毛毛雨），比那还细，像雾一样悬着。<br>艾雷岛的雨大部分是这种——所以伞没用，风也会把伞掀翻。</p>"));
  b.appendChild(E("h3",null,"聊天气用得上的"));
  WM.chips(b,[
   {en:"It's a bit dreich today.",zh:"今天有点阴湿。｜ 万能开场"},
   {en:"Some weather, eh?",zh:"这天气啊。｜ 最短的搭话"},

   {en:"You'll get soaked through.",zh:"你会湿透。｜ soaked through ＝ 湿透"},
   {en:"At least it's dry.",zh:"至少没下雨。｜ 英国人最低标准的乐观"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>为什么天气这么重要：</b>在英国和苏格兰，天气是<b>默认的开场白</b>。跟陌生人搭话不需要理由，说一句天气就行，对方一定接。<br><br>这对「临场反应」这个痛点是最便宜的解法——<b>你永远有一句话可以说</b>，而且永远不会说错。</div>"));
 },

{id:"desk",x:84,y:56,icon:"🚪",label:"前台报到",kind:"核心场景 · Checking in",title:"Come away in out of the rain",
 passage:{
  en:["Morning! Come away in out of the rain.",
      "Have you got a booking with us? Lovely — what name is it under?",
      "Right, I've got you here: two for the eleven o'clock.",
      "Are either of you Friends of Laphroaig? You are? Brilliant — bring your certificate, or just your account, either's fine.",
      "That's you checked in. Have a seat and someone'll come and get you in about five minutes.",
      "Toilets are just through there, and the shop's open if you fancy a wander."],

  tip:"整段是前台一口气说完的。<b>注意她一次问了几个问题——现场就是这个语速。</b>"},
 build(b){
  b.appendChild(E("h3",null,"六个说法，全是直译不通的"));
  WM.chips(b,[
   {en:"Come away in.",zh:"快进来。｜ 苏格兰特有的欢迎语，away 在这儿没有「离开」的意思"},
   {en:"What name is it under?",zh:"是用什么名字订的？｜ under ＝ 记在……名下"},
   {en:"I've got you here.",zh:"找到您了（在系统里）。｜ 不是「我抓住你了」"},
   {en:"Two for the eleven o'clock.",zh:"十一点那场，两位。｜ 买票订座的固定说法"},
   {en:"That's you checked in.",zh:"您登记好了。｜ 段 5 的 that's you sorted 同一个结构"},

{id:"kit",x:78,y:74,icon:"🧥",label:"借雨具",kind:"对话 · Borrowing waterproofs",title:"They lend you wellies",
 passage:{
  en:["We can lend you waterproofs if you're heading out to your plot.",
      "What size are you? We've got jackets from small up to extra large, and wellies in most sizes.",
      "They're clean, don't worry. Just bring them back when you're done.",
      "Are those shoes going to be alright? The ground out there is soft — you'll sink in.",
      "Honestly, take the wellies.",
      "Everybody says they'll be fine, and everybody comes back with wet feet."],
  zh:"如果你要去自己那块地，我们可以借你雨具。<br>你穿多大？外套有小号到加大号，雨靴大部分尺码都有。<br>是洗过的，别担心。用完还回来就行。<br>你那双鞋行吗？外面地很软——会陷进去的。<br>说真的，把雨靴穿上。<br>每个人都说自己没事，然后每个人回来都是湿脚。",
  tip:"最后一句是典型的<b>英式冷幽默</b>：不劝你，只陈述事实，让你自己得出结论。"},
 build(b){
  b.appendChild(E("h3",null,"英国人天天说、中国教材不教的词"));
  WM.vocab(b,[
   {w:"wellies",ipa:"/ˈweliz/",zh:"雨靴（Wellington boots 的昵称）",ja:"長靴"},
   {w:"waterproofs",ipa:"/ˈwɔːtəpruːfs/",zh:"防水衣裤（复数名词）",ja:"レインウェア"},
   {w:"to sink in",ipa:"/sɪŋk ɪn/",zh:"陷进去",ja:"沈み込む"},
   {w:"soft ground",ipa:"—",zh:"松软的地面（这里指泥煤地）",ja:"ぬかるみ"},
   {w:"to lend / to borrow",ipa:"/lend/ /ˈbɒrəʊ/",zh:"借出 / 借入（方向相反，别搞混）",ja:"貸す／借りる"}
  ]);
  b.appendChild(E("div","box","<p class='zh' style='margin:0'><b>lend 和 borrow 别搞反</b><br><br>· 他们 <b>lend</b> 你雨靴（东西从他们出去）<br>· 你 <b>borrow</b> 雨靴（东西到你这儿来）<br><br>你要说：<i>Could I <b>borrow</b> a pair of wellies?</i><br>他们会说：<i>We can <b>lend</b> you some.</i><br><br>中文都是「借」，所以这是中文母语者的高频错误。</p>"));
  b.appendChild(E("h3",null,"你会用到的"));
  WM.chips(b,[
   {en:"Could I borrow a jacket, please?",zh:"能借件外套吗？"},
   {en:"What size are you? — I'm a large, I think.",zh:"你穿多大？——大号吧我想。"},
   {en:"Do you have these in a bigger size?",zh:"这个有大一号的吗？"},
   {en:"Where should I bring them back to?",zh:"还到哪里？"},
   {en:"Are these alright to wear inside?",zh:"这个能穿进去吗？"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>英式冷幽默的结构</b>，值得学一下：<br><i>Everybody says they'll be fine, and everybody comes back with wet feet.</i><br><br>两个平行的句子，只换一个结果，<b>不下结论、不劝你</b>——笑点全在那个对比里。英国人的幽默大量靠这个：<b>把事实并排放，让听的人自己撞上去。</b></div>"));
 },
 check:{q:"你想跟前台要一双雨靴，哪句对？",
  opts:["Could I borrow a pair of wellies?","Could I lend a pair of wellies?","Could you borrow me a pair of wellies?","Could I lend you a pair of wellies?"],a:0,
  exp:"<b>borrow</b> ＝ 我把东西<b>拿过来</b>用；<b>lend</b> ＝ 我把东西<b>给出去</b>。<br><br>· 你要用 → <b>I borrow</b><br>· 他们给你 → <b>they lend me</b><br><br>C 选项 <i>Could you borrow me…</i> 是英语母语者小孩也会犯的错，但成年人不说。D 更离谱——你在把雨靴借给前台。"}},

{id:"wall",x:38,y:52,icon:"🏛",label:"白墙",kind:"威士忌 · The name on the wall",title:"那些字不是装饰，是给船看的",
 passage:{cap:"English first · 换成书面说明体",
  en:["The name is painted in black on a white wall, facing the sea, and it has been there for well over a century.",
      "Before there were proper roads on this coast, whisky left Laphroaig by boat.",
      "The letters were not decoration. They told the puffers where to tie up.",
      "The distillery was founded in 1815 by two brothers, Donald and Alexander Johnston.",
      "It stayed in the family for well over a hundred years, and it is now owned by Suntory of Japan.",
      "In 1994 it became the only whisky to carry a Royal Warrant.",
      "The wall still faces the sea, and the boats no longer come."],
  zh:"名字用黑漆写在白墙上，朝着海，已经在那儿一个多世纪了。<br>在这段海岸有像样的公路之前，威士忌是坐船离开拉弗格的。<br>那些字母不是装饰。它们告诉运货小汽船该在哪儿靠岸。<br>酒厂由 Donald 和 Alexander Johnston 兄弟建于 1815 年。<br>它在这个家族手里待了一百多年，如今归日本三得利所有。<br>1994 年它成为唯一持有王室认证的威士忌。<br>墙依然朝着海，而船不再来了。",
  tip:"注意最后一句的写法：<b>两个事实并排，中间用 and</b>，什么感慨都没写，但读起来是有分量的。"},
 build(b){
  b.appendChild(E("div","box","<p class='zh' style='margin:0'><b>puffer</b> ＝ 克莱德小汽船，19–20 世纪往返苏格兰西海岸和各岛的小型运货蒸汽船。艾雷岛的酒和麦芽全靠它们。<br><br>白墙黑字在海上几英里外就能认出来——<b>那是导航标识，不是 logo。</b>现在它成了整个威士忌世界最好认的一面墙。</p>"));
  b.appendChild(E("h3",null,"三个数字，记住就够"));
  b.appendChild(E("p","zh","· <b>1815</b>——建厂，Johnston 兄弟<br>· <b>1994</b>——获王室认证（当时的威尔士亲王、现查尔斯国王），也是 Friends of Laphroaig 成立那年<br>· <b>2014</b>——三得利收购 Beam，Laphroaig 归日本公司"));
  b.appendChild(E("h3",null,"「墙依然朝着海，而船不再来了」"));
  b.appendChild(E("div","box flat","<div class='small'>这句英语值得单独看：<br><i>The wall still faces the sea, and the boats no longer come.</i><br><br>· <b>still</b>（依然）和 <b>no longer</b>（不再）配成一对<br>· 两句都是最简单的主谓结构，一个形容词都没有<br>· 作者<b>没有说「令人惋惜」</b>，但你读到就感觉到了<br><br><b>这个手法可以直接偷：</b>想表达感慨时，不要写形容词，写两个对比的事实并排。写威士忌笔记立刻用得上。</div>"));
  b.appendChild(E("div","box flat","<div class='small'><b>⚑ 一个要标注的传说：</b>「禁酒令期间 Laphroaig 因为味道像药，被允许作为药用酒精进口美国」——这个故事流传极广、酒厂也爱讲，但<b>缺少可靠的一手记录</b>。当故事听可以，别当史实引用。</div>"));
 },
 check:{q:"为什么把名字写那么大画在朝海的墙上？",
  opts:["给运货的船看的，等于航海标识","为了游客拍照","这是王室认证的要求","为了防止别的酒厂冒用"],a:0,
  exp:"<b>They told the puffers where to tie up.</b> — tie up ＝ 系缆、靠岸。<br><br>在没有公路的年代，酒厂全靠海运，墙上的名字就是<b>给船长看的路标</b>。<br><br>顺带学一个结构：<b>tell somebody where to do something</b>——tell / show / ask 后面都能接「疑问词 + to do」：<i>show me how to use it / ask him where to go</i>。"}},

{id:"notes",x:15,y:31,icon:"📓",label:"本场笔记",kind:"写作 · Your notes for this scene",title:"这一场，你自己写",
 notes:{
  taskTitle:"写一封预约邮件",
  task:"给酒厂写一封 <b>4–6 句</b>的预约邮件。这一封你去之前<b>真的要写</b>，所以现在写出来，到时候改改就能发。<br><br><b>必须包含：</b><br>· 想订哪一场、几个人、大概什么日期<br>· 说明你是 Friend of Laphroaig<br>· 问一个问题（比如：那段时间是不是停产期？）<br>· 用一次 <b>Should you… / Could you…</b> 这种正式壳",
  placeholder:"Dear Laphroaig,\n\nI would like to…",
  minHeight:"140px",
  checklist:["<b>正式壳</b>：用了 <i>I would like to / Could you please / Should you need</i> 之类了吗？（别写 I want）",
   "<b>冠词</b>：a booking / the eleven o'clock / an enquiry —— 每个可数名词前有东西吗？",
   "<b>动词形式</b>：I <b>am writing</b> to ask（邮件开头的固定时态）；被动要用过去分词，别写成 -ing",
   "<b>问句语序</b>：<i>Could you tell me whether the distillery is closed…</i>（间接问句<b>不倒装</b>）",
   "<b>拼写</b>：enquiry / apologise / flavour —— 英式",
   "<b>结尾</b>：不认识对方名字用 <i>Yours faithfully</i>；知道名字用 <i>Yours sincerely</i>；日常用 <i>Kind regards</i>"],
  ref:"Dear Sir or Madam,\n\nI am writing to book a distillery tour for two people in early June next year. Could you tell me whether any tours are available in the first week of June, and whether the production areas will be open at that time? I am a Friend of Laphroaig, so I would also like to collect my dram while I am there. Should you need any further details, please let me know.\n\nKind regards,\n…",
  refNote:"用到的：<b>I am writing to…</b>（邮件开头万能句）／<b>Could you tell me whether…</b>（间接问句，不倒装）／<b>Should you need…</b>（正式倒装）／<b>Kind regards</b>。<br><br><b>没有一个难词。正式不等于难，正式等于用对壳。</b>"
 }},
