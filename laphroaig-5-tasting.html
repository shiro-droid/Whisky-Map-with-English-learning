{id:"jug",x:69,y:63,icon:"💧",label:"水壶",kind:"转折 · Adding water",title:"Just a drop, mind",

 passage:{

{id:"flight",x:45,y:62,icon:"🥃🥃",label:"三杯对比",kind:"实战 · The language of difference",title:"说出它们的差别",
 passage:{
  en:["Three glasses in front of you.",
      "All from the same distillery, the same water, the same peat, the same sea air.",
      "And not one of them tastes the same.",
      "The ten is the dry one — straight in with the smoke.",
      "The Quarter Cask sat in smaller casks, so it's had more wood on it: sweeter, rounder, a bit of coconut.",
      "And the cask strength is everything at once, at full volume.",
      "Try them in that order, and don't rush.",
      "The differences are the whole point."],
  zh:"你面前三个杯子。<br>同一个酒厂、同一处水、同一片泥煤、同一片海风。<br>但没有一杯是一样的。<br>10 年是干的那杯——烟味直上。<br>Quarter Cask 在更小的桶里待过，所以木头味更重：更甜、更圆、带点椰子。<br>桶强是所有东西一起来，音量开到最大。<br>按这个顺序喝，别赶。<br><b>差别本身就是全部的意义。</b>",
  tip:"最后那句，是你自己说过的话的英文版。"},
 build(b){
  const tabs=E("div","tabs"),out=E("div","box");
  const D=[{n:"10 Year",abv:"40%",en:"Straight in with the smoke. Seaweed and iodine on the nose, then a dry, ashy finish.",zh:"烟味直上。闻香是海藻和碘，收尾干、带灰烬感。"},
           {n:"Quarter Cask",abv:"48%",en:"Softer and sweeter. More wood on it — vanilla, coconut, a bit of toffee — but the smoke's still underneath.",zh:"更柔更甜。木头味更重——香草、椰子、一点太妃糖——但烟还在底下。"},
           {n:"Cask Strength",abv:"~57%",en:"Everything turned up. Oily and thick, and it really needs water. Add a drop and it opens right up.",zh:"所有东西都调大了。油润、厚，非常需要加水。滴一滴，它整个打开。"}];
  function draw(i){[...tabs.children].forEach((c,j)=>c.className="tab"+(j===i?" on":""));out.innerHTML="";
   const en=E("p","en",D[i].en);en.appendChild(WM.sb(D[i].en));out.appendChild(en);out.appendChild(E("p","zh",D[i].zh))}
  D.forEach((d,i)=>{const t=E("button","tab","<b>"+d.n+"</b>"+d.abv);t.onclick=()=>draw(i);tabs.appendChild(t)});
  b.appendChild(tabs);b.appendChild(out);draw(0);
  b.appendChild(E("h3",null,"说差别的六个零件"));
  WM.chips(b,[
   {en:"The Quarter Cask is sweeter than the ten.",zh:"QC 比 10 年甜。｜ -er than"},
   {en:"The cask strength isn't as easy to drink.",zh:"桶强没那么好入口。｜ not as … as（否定比较不能用 than）"},
   {en:"There's more of a vanilla note to the Quarter Cask.",zh:"QC 的香草感更明显。｜ more of a … ＝ 更偏向某种"},
   {en:"The ten is the driest of the three.",zh:"三杯里 10 年最干。｜ 最高级 + of the three"},
   {en:"It's somewhere between the two.",zh:"介于两者之间。"},
   {en:"Same cask, but they're not quite the same.",zh:"同一个桶，但不完全一样。｜ not quite ＝ 不完全"}
  ]);
  b.appendChild(E("h3",null,"说变化"));
  WM.chips(b,[
   {en:"It opens up with water.",zh:"加水后打开了。"},
   {en:"Give it a minute in the glass.",zh:"让它在杯里放一会儿。"},
   {en:"It changes as it sits.",zh:"放着放着就变了。"},
   {en:"The smoke fades into the background.",zh:"烟味退到后面去了。"}
  ]);
 },
 check:{q:"「桶强没有 10 年那么好入口」——哪句对？",
  opts:["The cask strength isn't as easy to drink as the ten.","The cask strength isn't so easy to drink than the ten.","The cask strength isn't easier as the ten.","The cask strength is not as easier than the ten."],a:0,
  exp:"否定比较的唯一结构：<b>not as + 原级形容词 + as</b>。<br><br>记死这条：<b>than 只能跟比较级</b>（sweeter than），<b>as 只能跟原级</b>（as easy as）。两个混用是中文母语者最高频的错误之一。"}},

{id:"window",x:78,y:19,icon:"🌊",label:"窗外",kind:"威士忌 · Why it tastes of medicine",title:"答案就在窗外那片海",
 passage:{cap:"English first · 换成书面说明体",
  en:["Peat is not just smoke. It is the ground itself.",
      "Thousands of years of heather, moss and seaweed, pressed down in the wet.",
      "When it burns under the malting floor, the smoke carries phenols, and those phenols stick to the barley and travel all the way into the glass.",
      "Inland peat is made of trees and ferns, so it smells of a bonfire.",
      "Islay peat is made of the shore, so it smells of iodine and salt.",
      "That is why this whisky tastes of medicine.",
      "You are not tasting a flavouring. You are tasting the island."],
  zh:"泥煤不只是烟。它就是土地本身。<br>几千年的石南、苔藓和海藻，在潮湿中被压实。<br>它在发麦楼下面燃烧时，烟里带着酚类，那些酚附着到大麦上，一路走进杯子里。<br>内陆的泥煤由树木和蕨类构成，所以闻起来像篝火。<br>艾雷的泥煤由海岸构成，所以闻起来是碘和盐。<br>这就是为什么这酒尝起来像药。<br><b>你尝到的不是一种香料，你尝到的是这座岛。</b>",
  tip:"注意这段和前面几段<b>完全不同的语感</b>：句子更长、不用缩写（It is 不写 It's）、词更正式。这是<b>书面说明文</b>的英语。"},
 build(b){
  b.appendChild(E("div","box","<p class='zh' style='margin:0'><b>为什么让你注意文体？</b><br><br>你之前那段英语混了两种腔：口语的随意（<i>actually, I'm not sure…</i>）和书面的复杂。<b>这不是错，但知道自己在用哪一种，你就控制得住。</b><br><br>· 口语：短句、缩写（it's, don't）、<i>a wee bit</i>、<i>folk say</i><br>· 书面：长句、不缩写、<i>That is why…</i>、<i>You are not tasting…</i></p>"));
  b.appendChild(E("h3",null,"Laphroaig 的硬事实"));
  b.appendChild(E("p","zh","· 泥煤含量约 <b>40–45 ppm</b> 酚值<br>· 少数保留 <b>floor maltings 地板发麦</b>的酒厂之一，自产约 10% 麦芽，泥煤<b>手工切</b><br>· 水源来自 <b>Kilbride</b> 水坝<br>· 3 个初馏器 + 4 个再馏器<br>· 1815 年由 Donald 和 Alexander Johnston 兄弟创立"));
  b.appendChild(E("h3",null,"三个可能让你意外的"));
  b.appendChild(E("p","zh","<b>① 它是日本公司的。</b>2014 年三得利（Suntory）收购 Beam 时一并拿下。你手上土屋守那些日文资料，写的是自家酒厂。"));
  b.appendChild(E("p","zh","<b>② 唯一持王室认证的威士忌。</b>1994 年由当时的威尔士亲王（现查尔斯国王）授予，他偏爱 15 年。"));
  b.appendChild(E("p","zh","<b>③ Oyster Night 是真的。</b>酒厂有官方活动：5 杯 Laphroaig 配 5 只生蚝。村上春树在《如果我们的语言是威士忌》里写过的那个吃法——往生蚝上滴几滴单一麦芽再连壳吸下去——在这里有正式活动对应。"));
  b.appendChild(E("hr","sep"));
  WM.vocab(b,[
   {w:"peat",ipa:"/piːt/",zh:"泥煤",ja:"ピート"},
   {w:"phenol",ipa:"/ˈfiːnɒl/",zh:"酚",ja:"フェノール"},
   {w:"heather",ipa:"/ˈheðə/",zh:"石南",ja:"ヘザー"},
   {w:"iodine",ipa:"/ˈaɪədiːn/",zh:"碘（味）",ja:"ヨード"},
   {w:"seaweed",ipa:"/ˈsiːwiːd/",zh:"海藻",ja:"海藻"},
   {w:"floor maltings",ipa:"/flɔː ˈmɔːltɪŋz/",zh:"地板发麦",ja:"フロアモルティング"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>🗓 去之前要知道：</b>2026 年 <b>7/8 – 9/13 是停产期（silent season）</b>，这期间参观进不了生产区。要看地板发麦和蒸馏，<b>避开盛夏</b>。参观走官网跳 AnyRoad 预约。</div>"));
 },
 check:{q:"这一段用的是哪种文体？根据什么判断？",
  opts:["书面说明文——句子长、不用缩写（It is / You are）、用 That is why 这类正式连接","口语——因为出现了 smells 这种日常动词","诗歌——因为最后一句有修辞","广告文案——因为在夸自己的酒"],a:0,
  exp:"关键证据是<b>不用缩写</b>：全段写 <i>It is / You are / That is</i>，一次 <i>it's</i> 都没有。<b>缩写是口语和书面之间最明显的分界线。</b><br><br>顺带：最后一句 <i>You are not tasting a flavouring. You are tasting the island.</i> 是<b>平行结构</b>——同样的句式重复一次只换一个词。<b>你可以直接偷来用。</b>"}},

{id:"board",x:40,y:52,icon:"📋",label:"黑板",kind:"词汇 · EN / 中文 / 日本語",title:"品鉴词表",
 passage:{cap:"English first · 一整条品鉴笔记",
  en:["On the nose: peat smoke, iodine and wet rope.",
      "On the palate: oily and briny at first, then sweeter, with vanilla and a little toffee.",
      "The finish is long, dry and ashy.",
      "With water it opens up, and the smoke settles into the background.",
      "A classic Islay dram — peaty, medicinal, and not remotely shy."],
  zh:"闻香：泥煤烟、碘、湿绳子。<br>入口：先是油润和咸腥，然后转甜，带香草和一点太妃糖。<br>余韵长、干、带灰烬感。<br>加水后打开，烟味退到后面。<br>一杯经典的艾雷——泥煤、药味，而且一点都不含蓄。",
  tip:"这就是一条<b>完整的品鉴笔记</b>，下面词表里的词几乎全在里面。先听懂整条，再看拆开的词。"},
 build(b){
  b.appendChild(E("div","box flat","<div class='small'>注意骨架：<b>On the nose → On the palate → The finish → With water</b>。<br>这四个短语是固定顺序，几乎所有英文品鉴笔记都按这个走。<b>记住骨架，你就能读懂任何一条。</b></div>"));

   {w:"nose",ipa:"/nəʊz/",zh:"香气；（动词）闻香",ja:"香り／ノージング"},

   {w:"finish",ipa:"/ˈfɪnɪʃ/",zh:"余韵",ja:"フィニッシュ／余韻"},
   {w:"dram",ipa:"/dræm/",zh:"一小杯威士忌",ja:"ドラム（一杯）"}
  ]);
  b.appendChild(E("h3",null,"② 艾雷岛的味道"));
  WM.vocab(b,[
   {w:"peaty",ipa:"/ˈpiːti/",zh:"泥煤味的",ja:"ピーティー"},
   {w:"smoky",ipa:"/ˈsməʊki/",zh:"烟熏的",ja:"スモーキー"},
   {w:"medicinal",ipa:"/məˈdɪsɪnl/",zh:"药味的",ja:"薬品香"},
   {w:"briny",ipa:"/ˈbraɪni/",zh:"咸腥的（海水感）",ja:"塩気のある"},
   {w:"tar",ipa:"/tɑː/",zh:"焦油",ja:"タール"},
   {w:"ashy",ipa:"/ˈæʃi/",zh:"灰烬感的",ja:"灰っぽい"},
   {w:"oily",ipa:"/ˈɔɪli/",zh:"油润的",ja:"オイリー"}
  ]);
  b.appendChild(E("h3",null,"③ 甜的那一侧（你近期的口味）"));
  WM.vocab(b,[
   {w:"vinous",ipa:"/ˈvaɪnəs/",zh:"葡萄酒般的（雪莉桶专用）",ja:"ワイン様の"},
   {w:"sherry cask",ipa:"/ˈʃeri kɑːsk/",zh:"雪莉桶",ja:"シェリー樽"},

   {w:"cask strength",ipa:"/kɑːsk streŋθ/",zh:"桶强（未稀释）",ja:"カスクストレングス"},
   {w:"expression",ipa:"/ɪkˈspreʃn/",zh:"酒款（同厂不同版本）",ja:"エクスプレッション"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>vinous</b> 就是你上次写 <i>“like an old wine”</i> 时够不到的那个词。/ˈvaɪnəs/，来自拉丁语 vinum。你那瓶雪莉桶 Macallan 的官方笔记上，大概率就有这个词。</div>"));
 },
 check:{q:"品鉴笔记里 <b>“not remotely shy”</b> 是什么意思？",
  opts:["一点都不含蓄（味道非常张扬）","有点害羞、内敛","不太好闻","离得远才闻得到"],a:0,
  exp:"<b>not remotely + 形容词</b> ＝「一点都不……」，remotely 在否定句里是强化词。<br><br>而 <b>shy</b> 形容酒 ＝「内敛、不张扬」，是品鉴笔记里的常用拟人词（还有 <i>closed</i>「封闭」、<i>open</i>「打开」、<i>bold</i>「张扬」）。<br><br>所以这句是英式的低调反讽：<b>说 Laphroaig 猛得要命。</b>"}},

{id:"smws",x:23,y:20,icon:"🍾",label:"那瓶 24",kind:"阅读 · SMWS 的怪英语",title:"你已经在买的那套教材",
 passage:{cap:"English first · SMWS 风格（我仿写的，不是原文）",
  en:["A peat fire in a leather armchair.",
      "On the nose: wet rope, bonfire smoke and something antiseptic.",
      "On the palate: sweeter than expected, with brine and vanilla.",
      "The finish is long, dry and faintly medicinal.",
      "With water it opens up — coconut, warm sand, and the smoke settles into the background."],
  zh:"「皮扶手椅里的泥煤火」<br>闻香：湿绳子、篝火烟，还有某种消毒水味。<br>入口：比预想的甜，带海水味和香草。<br>余韵长、干、隐隐的药味。<br>加水后打开——椰子、晒热的沙，烟味退到后面去。",
  tip:"SMWS 笔记的第一句永远是<b>一个荒谬到具体的画面</b>，不是形容词。这就是他们的招牌。"},
 build(b){
  b.appendChild(E("p","zh","架子上那瓶深色的，标上没有酒厂名，只有<b>两段数字</b>。前一个是<b>酒厂代码</b>（按学会首次买入该厂的顺序编号），后一个是这厂的<b>第几个桶</b>。"));
  const w=E("div","chips");
  [["24.xxx","Macallan — 就是你那瓶"],["29.xxx","Laphroaig — 本章"],["3.xxx","Bowmore"],["1.xxx","Glenfarclas — 学会的第一桶"]]
   .forEach(p=>w.appendChild(E("div","chip","<span>"+p[0]+"</span><small>"+p[1]+"</small>")));
  b.appendChild(w);
  b.appendChild(E("h3",null,"拆开看这条笔记的五段骨架"));
  const S=[["① 荒诞酒名","A peat fire in a leather armchair","一个具体到荒谬的画面，不是形容词堆砌。这一句是 SMWS 的灵魂。"],
           ["② Nose","On the nose: wet rope, bonfire smoke and something antiseptic","名词短语并列，不写完整句。<b>something + 形容词</b>＝「某种……的东西」，说不准的时候超好用。"],
           ["③ Palate","On the palate: sweeter than expected, with brine and vanilla","几乎每条都有一个转折。<b>sweeter than expected</b> 这个说法你可以直接偷。"],
           ["④ Finish","The finish is long, dry and faintly medicinal","三个形容词收尾。<b>faintly</b>＝「隐隐地」，比 a little 高级。"],
           ["⑤ With water","With water it opens up — coconut, warm sand, and the smoke settles into the background","招牌段落，最像散文。<b>warm sand</b> 这种词组是 SMWS 的典型：具体、有温度、非标准。"]];
  S.forEach(s=>{
   const d=E("div","rw");d.style.cssText="border-left:3px solid var(--heather);padding-left:11px;margin:14px 0";
   d.appendChild(E("div","small","<b style='color:var(--heather)'>"+s[0]+"</b>"));
   const en=E("p","en",s[1]);en.style.fontSize="15px";en.appendChild(WM.sb(s[1]));
   d.appendChild(en);d.appendChild(E("div","why",s[2]));b.appendChild(d);
  });
  b.appendChild(E("div","box flat","<div class='small'>你那瓶雪莉桶 Macallan：你写的 <i>“like an old wine”</i> → 标准说法是 <b>vinous</b>；<i>“berry wood”</i> 拆开是 <b>dark berries</b>（果）+ <b>polished oak</b>（木）。<br><br><b>“bright sweetness” 你用得很好</b>，是真实的品鉴用词，保留。</div>"));
 },
 check:{q:"SMWS 笔记里写 <b>“something antiseptic”</b>，为什么不直接写 antiseptic？",
  opts:["因为闻到的东西说不准是什么，something + 形容词 表示「某种……的味道」","因为 antiseptic 不能单独用","因为要凑字数","因为这是名词，前面必须加 something"],a:0,
  exp:"<b>something + 形容词</b> 是英语里表达「说不准」的标准手法：<i>something sweet / something floral / something you can't quite name</i>。<br><br><b>这对你特别有用</b>——你的痛点是临场说不出精确的词。有了这个结构，<b>你不用找到那个准确的词也能说出一句完整、地道的话。</b>"}},

{id:"sign",x:14,y:49,icon:"🍀",label:"木牌",kind:"Gàidhlig 彩蛋",title:"这个名字，一半是维京人的",
 passage:{cap:"English first · 词源彩蛋",
  en:["Nearly every place name on this island is a puzzle in two languages.",
      "Laphroaig comes from the Gaelic lag, a hollow — but the second half is Norse: breiðr-vík, the broad bay.",
      "The Vikings held these islands for four hundred years, and they left their words in the ground.",
      "They did the same to English.",
      "Sky, skin, egg, knife, window, husband — all borrowed from Old Norse.",
      "Even they, them and their.",
      "So when a Scottish place name defeats you, remember: English is a borrowed language too."],
  zh:"这岛上几乎每一个地名都是两种语言的谜题。<br>Laphroaig 来自盖尔语 lag「凹地」——但后半截是诺尔斯语：breiðr-vík「宽阔的海湾」。<br>维京人统治这些岛屿四百年，把他们的词留在了土地里。<br>他们对英语做了同样的事。<br>Sky、skin、egg、knife、window、husband——全是从古诺尔斯语借的。<br>连 they、them、their 也是。<br><b>所以当一个苏格兰地名难住你的时候，记住：英语本身也是一门借来的语言。</b>"},
 build(b){
  const d=E("div","dark");
  d.innerHTML="<p class='gd' style='font-size:19px;margin:0'>Lag Bhròdhaig</p><p style='margin:4px 0 0'>「宽阔海湾的凹地」<br>盖尔语 lag（凹地）＋ 古诺尔斯语 breiðr-vík（宽湾）</p>";
  b.appendChild(d);
  b.appendChild(E("p","zh","9 到 13 世纪，赫布里底群岛是挪威人的地盘。岛上的地名至今一半带诺尔斯语词根——<b>这个名字是维京人留在土地上的指纹。</b>"));
  b.appendChild(E("h3",null,"连人称代词都是借的"));

{id:"mic",x:41,y:83,icon:"🎙",label:"跟读",kind:"跟读 · Record & compare",title:"说出来，然后听自己",
 build(b){
  b.appendChild(E("p","small","iPhone 的 Safari 没有语音识别 API，做不了自动打分。<b>但录下来自己听，其实比分数有用</b>——你会立刻听出哪里不对。"));
  const S=[{en:"I get a bit of vanilla, and there's a hint of smoke behind it.",zh:"我尝到一点香草，后面还有一丝烟味。"},
           {en:"It's not as sweet as I expected — there's more of a sherry note to it.",zh:"没我想的那么甜——雪莉感更明显一些。"},
           {en:"It opens up with water. The smoke fades into the background.",zh:"加水后它打开了，烟味退到后面去了。"},
           {en:"Same cask, but they're not quite the same. That's the fun of it.",zh:"同一个桶，但它们不完全一样。这就是好玩的地方。"},
           {en:"I'm not sure what to call it. What would you call that?",zh:"我不知道该怎么形容。你会怎么说？"}];
  let i=0;
  const card=E("div","box"),enP=E("p","en",""),zhP=E("p","zh","");
  card.appendChild(enP);card.appendChild(zhP);
  const row=E("div","btnrow"),orig=E("button","btn sea","▶︎ 原音（慢）"),rec=E("button","btn pri","🎙 录音"),nxt=E("button","btn sm","↻ 换一句");
  row.appendChild(orig);row.appendChild(rec);row.appendChild(nxt);card.appendChild(row);
  const audio=E("audio");audio.controls=true;audio.hidden=true;card.appendChild(audio);
  const msg=E("p","small","");card.appendChild(msg);b.appendChild(card);
  function draw(){enP.textContent=S[i].en;zhP.textContent=S[i].zh;audio.hidden=true;audio.removeAttribute("src");rec.textContent="🎙 录音";msg.textContent=""}
  orig.onclick=()=>WM.speak(S[i].en,0.78);
  nxt.onclick=()=>{i=(i+1)%S.length;draw()};
  let recorder=null,chunks=[],url=null;
  rec.onclick=async()=>{
   if(recorder&&recorder.state==="recording"){recorder.stop();return}
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    msg.innerHTML="⚠︎ 这个环境不能录音。<b>必须用 https 打开</b>（本地 file:// 拿不到麦克风），iOS 需要 14.3 以上。";return}
   try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    let mime="";
    if(window.MediaRecorder.isTypeSupported){
     if(MediaRecorder.isTypeSupported("audio/mp4"))mime="audio/mp4";
     else if(MediaRecorder.isTypeSupported("audio/webm"))mime="audio/webm"}
    recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    chunks=[];
    recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onstop=()=>{
     stream.getTracks().forEach(t=>t.stop());
     if(url)URL.revokeObjectURL(url);
     url=URL.createObjectURL(new Blob(chunks,{type:mime||"audio/mp4"}));
     audio.src=url;audio.hidden=false;rec.textContent="🎙 重录";
     msg.textContent="录好了。原音 → 自己 → 原音，来回两三遍，差在哪你会自己听出来。";recorder=null};
    recorder.start();rec.textContent="⏹ 停止";msg.textContent="录音中…";
   }catch(err){msg.textContent="⚠︎ 拿不到麦克风："+(err&&err.name?err.name:"unknown")}};
  draw();
  b.appendChild(E("div","box flat","<div class='small'><b>只盯一件事：重音落在哪。</b>中文习惯每个字平均用力，英语是几个词重、其余全滑过去。<br><i>I <b>GET</b> a bit of va-<b>NIL</b>-la, and there's a <b>HINT</b> of <b>SMOKE</b> behind it.</i><br>听原音时数一下有几个重音，再听自己的。</div>"));
 },
 check:{q:"英语句子里，下面哪一类词<b>通常不重读</b>？",
  opts:["冠词、介词、助动词（a / of / there's）","名词（vanilla / smoke）","实义动词（get / open）","形容词（sweet / dry）"],a:0,
  exp:"英语是<b>重音计时语言</b>：实词重读，虚词弱读甚至含糊掉。<br><br><i>there's a hint of</i> 母语者读起来接近「ðərzə<b>HINT</b>əv」——四个词挤成一坨。<br><br><b>这就是你听不清的真正原因</b>：不是词不认识，是虚词被压扁了。跟读时故意把它们读轻，反而更像。"}},
