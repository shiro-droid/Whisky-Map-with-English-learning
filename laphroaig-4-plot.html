const SPOTS=[
{id:"map",x:46,y:88,icon:"🗺",label:"找路",kind:"实用 · Directions",title:"Follow the track until it runs out",

  en:["Right, here's your map. Your plot is number four-four-seven-one.",

      "You'll come to a burn — that's a stream — with a plank over it. Cross that.",

      "If you get lost, the distillery's behind you and the sea's on your right. You can't really go wrong."],
  zh:"好，地图给你。你那块地是 4471 号。<br>从后门出去，沿着小路走过烘窑，一直走到路走完为止。<br>你会碰到一条 burn——就是小溪——上面有块木板。过去。<br>你那一排是从水边数上来第四排。数标记就行。<br>大概走十分钟，而且会比看起来湿。<br>要是迷路了，酒厂在你背后，海在你右手边。你其实走不丢。",
  tip:"<b>burn</b> ＝ 小溪，是苏格兰词，在英国地图上到处都是（Bannockburn、Burnside）。他自己都顺口解释了一句 <i>that's a stream</i>——说明他知道外地人听不懂。"},

   {w:"track",ipa:"/træk/",zh:"土路、小径",ja:"小道"},
   {w:"glen",ipa:"/ɡlen/",zh:"狭谷（Glenfiddich、Glenlivet 的 Glen）",ja:"渓谷"},

{id:"bog",x:36,y:56,icon:"🥾",label:"泥煤地",kind:"地理 · The bog",title:"这不是地，是被死掉的植物撑住的水",
 passage:{cap:"English first · 书面说明体",
  en:["This is peat bog, and it is not solid ground. It is water held up by dead plants.",
      "Step on the bright green moss and you will go in up to your knee. Step on the heather and it will hold you.",
      "Those brown stripes over there are peat banks, cut by hand with a special spade.",
      "One bank takes a family a week to cut, and it will heat a house for a year.",
      "Higher up, where it is drier, that is moor.",
      "Down by the shore, that flat grassy ground is machair — shell sand blown inland, and in June it is full of flowers."],
  zh:"这是泥煤沼，它不是实地。它是被死掉的植物撑住的水。<br>踩在鲜绿的苔藓上，你会陷到膝盖。踩在石南上，它会托住你。<br>那边那些褐色的条纹是泥煤切面，用一种特制的铁锹手工切下来的。<br>一家人切一条要一星期，而它能给一栋房子供一年的暖。<br>再往上、干一些的地方，那叫 moor（荒原）。<br>靠海那边平坦的草地叫 machair——被风吹到内陆的贝壳沙，六月里开满花。",
  tip:"<b>It is water held up by dead plants.</b> ——一句话定义泥煤，没有一个专业术语。这就是好的说明文。"},
 build(b){
  b.appendChild(E("h3",null,"四种地貌，四个词"));
  WM.vocab(b,[
   {w:"bog",ipa:"/bɒɡ/",zh:"沼泽、泥煤沼（软、含水）",ja:"湿原／泥炭地"},
   {w:"moor",ipa:"/mʊə/",zh:"荒原（高一点、干一点）",ja:"荒野／ムーア"},
   {w:"heather",ipa:"/ˈheðə/",zh:"石南（紫色小花，能承重）",ja:"ヘザー／エリカ"},
   {w:"moss",ipa:"/mɒs/",zh:"苔藓（鲜绿，踩上去会陷）",ja:"コケ"},
   {w:"machair",ipa:"/ˈmæxər/",zh:"马海尔（贝壳沙草地，赫布里底特有）",ja:"マハール（貝殻砂草原）"},
   {w:"peat bank",ipa:"—",zh:"泥煤切面（一条条切下来的断面）",ja:"ピートバンク"}
  ]);
  b.appendChild(E("div","box","<p class='zh' style='margin:0'><b>一条保命的常识：绿的别踩，紫的能踩。</b><br><br>· <b>鲜绿的苔藓（moss）</b>＝ 下面是水，一脚下去到膝盖<br>· <b>石南（heather）</b>＝ 根系密实，能托住你<br><br>这不是比喻。艾雷岛每年都有游客陷进去。<b>去的时候真的按这条走。</b></p>"));
  b.appendChild(E("h3",null,"祈使句 + and：一个特别好用的结构"));
  b.appendChild(E("div","box flat","<div class='small'><i><b>Step</b> on the moss <b>and</b> you will go in up to your knee.</i><br>「踩在苔藓上，你就会陷到膝盖」<br><br><b>祈使句 + and + 结果</b> ＝ 如果……就会……<br>· <i>Ask him and he'll tell you.</i> 问他他就会告诉你<br>· <i>Add water and it opens up.</i>（段 5 那杯酒！）<br><br>还有反过来的 <b>祈使句 + or</b>：<br>· <i>Take the wellies, or you'll get wet feet.</i> 穿雨靴，不然会湿脚<br><br><b>比 if 从句短一半，而且更有力。</b>口语里母语者大量使用。</div>"));
  b.appendChild(E("div","box flat","<div class='small'><b>machair</b> /ˈmæxər/ 是盖尔语借词，指赫布里底群岛西岸特有的一种地貌：海风把贝壳碎屑吹到内陆，混进酸性泥煤土里，中和出一片肥沃的碱性草地。<br><br>六月开满野花，是欧洲最稀有的栖息地之一。<b>英语里没有别的词能代替它</b>——所以直接借了。</div>"));
 },
 check:{q:"在泥煤地上，踩哪里是安全的？",
  opts:["石南（heather）——根系密实，能托住人","鲜绿的苔藓（moss）——看起来最结实","褐色的泥煤切面——已经被挖过了","哪里都一样，反正是地"],a:0,
  exp:"<b>Step on the heather and it will hold you.</b> —— 石南的根系密实，能承重。<br><b>Step on the bright green moss and you will go in up to your knee.</b> —— 鲜绿苔藓下面全是水。<br><br>记住这个反直觉的规律：<b>看起来最柔软鲜嫩的地方最危险。</b><br><br>顺带注意 <b>up to your knee</b>（到膝盖那么深）——<b>up to</b> 表示程度上限，这个词组在数字、时间、深度上都用：<i>up to ten people / up to three hours</i>。"}},

{id:"flag",x:66,y:60,icon:"🚩",label:"你的一平方英尺",kind:"仪式 · Your plot",title:"苏格兰唯一用威士忌付租金的租约",
 passage:{
  en:["This is your square foot.",
      "Traditionally you plant a flag on it, write your number on it, and take a photograph. People have been doing that here since 1994.",
      "The scheme was reorganised a few years back and the paperwork is different now, so ask at the visitor centre before you walk out.",
      "What hasn't changed is the rent.",
      "You hold a square foot of Islay, and the rent Laphroaig owes you is one dram a year, collected in person.",
      "As far as anybody knows, it is the only lease in Scotland that is paid in whisky."],
  zh:"这就是你那一平方英尺。<br>按传统你会在上面插一面旗，写上你的编号，拍张照。从 1994 年起人们就一直这么做。<br>这个计划几年前改组过，手续跟以前不一样了，所以出门之前先在游客中心问一句。<br>没变的是租金。<br>你持有艾雷岛的一平方英尺，而拉弗格欠你的租金是每年一杯酒，本人亲自来领。<br>据大家所知，这是苏格兰唯一一份用威士忌支付的租约。",
  tip:"<b>⚑ 我要标一下：</b>插旗那套仪式在较早的访客记述里都有，但 2021 年改成积分制后官网只写「1 平方英尺终身租约 + GPS 坐标证书 + 到访领一杯 dram」，<b>没提旗子</b>。去之前问一句。"},
 build(b){
  b.appendChild(E("h3",null,"现在完成进行时：people have been doing that since 1994"));

{id:"chat",x:87,y:76,icon:"☁️",label:"闲聊",kind:"痛点专项 · Small talk",title:"这一格是全站最难也最值钱的",
 passage:{
  en:["Some weather, eh?",
      "Where've you come from, then? Oh aye? And how long are you over for?",
      "Is this your first time on Islay? What have you managed to see so far?",
      "Have you been round any of the others — Ardbeg, Lagavulin?",

      "I'll tell you what, though: you've picked a good week. Last week it never stopped."],
  zh:"这天气啊。<br>你从哪儿来的？哦是吗？那你要待多久？<br>这是你第一次来艾雷吗？到目前为止都看了些什么？<br>别的酒厂去过吗——Ardbeg、Lagavulin？<br>那你觉得它们怎么样？<br>不过我跟你说：你挑了个好星期。上个礼拜就没停过。",
  tip:"<b>这六句是苏格兰人搭话的标准套路，顺序几乎固定：天气 → 你从哪来 → 待多久 → 第一次吗 → 去过哪 → 觉得怎样。</b>知道套路，你就能预判下一个问题。"},
 build(b){

   {en:"Where've you come from, then?",zh:"你从哪儿来的？｜ 句尾 then 是软化，不是「然后」"},

  b.appendChild(E("h3",null,"你要准备的六句回答（把它们变成你自己的）"));
  WM.chips(b,[

  b.appendChild(E("h3",null,"完整走一遍"));
  WM.dialogue(b,[
   {who:"g",en:"Some weather, eh? Where've you come from, then?",zh:"这天气啊。你从哪儿来的？"},
   {who:"y",en:"<mark class='k'>I'm over from China, actually.</mark> I work in Edinburgh sometimes, so I came across for a few days.",zh:"我从中国过来的。我有时候在爱丁堡工作，所以过来待几天。"},
   {who:"g",en:"<mark>Oh aye?</mark> That's a fair way. First time on Islay?",zh:"哦是吗？那可不近。第一次来艾雷？"},
   {who:"y",en:"<mark class='k'>Aye, first time.</mark> I've been round Ardbeg and Lagavulin so far.",zh:"对，第一次。目前去了 Ardbeg 和 Lagavulin。"},

   {who:"g",en:"Aye, it is that. <mark>I'll tell you what, though</mark> — you've picked a good week. Last week it never stopped.",zh:"对，确实。不过我跟你说——你挑了个好星期。上礼拜就没停过。"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>为什么说这一格最值钱：</b><br><br>你选的痛点是「开口说 / 临场反应」。而闲聊之所以难，不是词难，是<b>你不知道下一个问题是什么</b>，所以每一句都在临时反应。<br><br>但你刚看到了：<b>这个套路是固定的。</b>天气 → 从哪来 → 待多久 → 第一次吗 → 去过哪 → 怎么样。六句，顺序几乎不变。<br><br><b>把你的六句回答提前想好，闲聊就从「即兴」变成「填空」。</b>这就是这一格的全部诀窍。</div>"));
 },
 check:{q:"对方问 <b>“What did you make of them?”</b> 他在问什么？",
  opts:["你觉得它们怎么样？","它们是用什么做的？","你从它们那儿买了什么？","你把它们做成了什么？"],a:0,
  exp:"<b>make of</b> ＝ 对……有什么看法、怎么理解。跟「制造」毫无关系。<br><br>· <i>What do you make of him?</i> 你觉得这人怎么样？<br>· <i>I don't know what to make of it.</i> 我不知道该怎么看这件事。<br><br>它比 <i>what did you think</i> 更常用、更地道，而且暗含「这东西有点复杂」——用在威士忌上刚刚好。<br><br><b>回答不要用 make</b>，直接说感受：<i>I liked it. / It wasn't what I expected.</i>"}},

{id:"birds",x:57,y:14,icon:"🦢",label:"天上",kind:"自然 · Wildlife",title:"冬天这岛上鹅比人多",
 passage:{
  en:["Look up while you're out here.",
      "Islay has more geese than people in the winter — forty thousand barnacle geese come down from Greenland every October.",
      "There are choughs on the cliffs, a red-billed crow you'll not see anywhere else in Britain.",
      "And if a big bird goes over and you think that's too big to be a buzzard — it probably is. There are golden eagles here.",
      "No snakes, no squirrels, and hardly a tree for miles.",
      "The wind sees to that."],
  zh:"在外面的时候记得抬头。<br>冬天艾雷岛的鹅比人多——每年十月有四万只白颊黑雁从格陵兰飞下来。<br>崖壁上有红嘴山鸦，一种红喙的鸦，全英国别的地方你都见不到。<br>要是有只大鸟飞过，你心想「这也太大了不像鵟」——那多半就是。这儿有金雕。<br>没有蛇，没有松鼠，方圆几英里几乎没有树。<br>那是风干的。",
  tip:"<b>you'll not see</b> —— 苏格兰否定第三次出现了（段 5 / 段 1 / 这里）。还有段 3 学的 <b>too … to …</b> 也在里面。"},
 build(b){
  b.appendChild(E("h3",null,"最后那句才是重点"));
  b.appendChild(E("div","box","<p class='zh' style='margin:0'><i><b>The wind sees to that.</b></i>「那是风干的。／风负责这件事。」<br><br><b>see to something</b> ＝ 负责搞定某事、料理某事<br>· <i>I'll see to it.</i> 我来处理。<br>· <i>Could you see to the drinks?</i> 酒水你负责一下好吗？<br>· <i>He'll see to it that you get a copy.</i> 他会确保你拿到一份。<br><br>这里是拟人用法：<b>风把树的事「料理」了</b>——所以岛上没树。<br><br>短短四个词，比 <i>because the wind is too strong for trees to grow</i> 有力十倍。<b>英语的力量常常来自把长解释压成一个短动词。</b></p>"));
  b.appendChild(E("h3",null,"顺带三个自然词"));
  WM.vocab(b,[
   {w:"barnacle goose",ipa:"/ˈbɑːnəkl ɡuːs/",zh:"白颊黑雁（复数 geese）",ja:"カオジロガン"},
   {w:"chough",ipa:"/tʃʌf/",zh:"红嘴山鸦（拼写坑：读「查夫」）",ja:"ベニハシガラス"},
   {w:"buzzard",ipa:"/ˈbʌzəd/",zh:"鵟（英国最常见的猛禽）",ja:"ノスリ"},
   {w:"golden eagle",ipa:"/ˈɡəʊldən ˈiːɡl/",zh:"金雕",ja:"イヌワシ"},
   {w:"cliff",ipa:"/klɪf/",zh:"崖壁",ja:"崖"},
   {w:"hardly",ipa:"/ˈhɑːdli/",zh:"几乎不（本身是否定词）",ja:"ほとんど〜ない"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>hardly 是个否定词</b>，别再加 not：<br>· <i>hardly a tree for miles</i> 方圆几英里几乎没树 ✓<br>· <i>There are hardly <b>any</b> trees.</i> ✓（hardly 后面接 any，不接 no）<br>· <s>There are hardly no trees.</s> ✗ 双重否定<br><br>同族的还有 <b>scarcely / barely / seldom</b>，全都自带否定。</div>"));
  b.appendChild(E("div","box flat","<div class='small'><b>为什么艾雷岛没有树？</b>不是没长过。这岛在几千年前是有林地的，后来被砍光、被羊啃光，加上<b>大西洋常年的盐风</b>，树苗立不住。<br><br>而没有树的直接结果是：<b>植物死了以后没法分解，堆在潮湿的地上，几千年压成泥煤。</b>没有风就没有泥煤，没有泥煤就没有 Laphroaig。<br><br>——所以段 5 那句 <i>You are tasting the island</i>，往上追一层，其实是在尝这阵风。</div>"));
 },
 check:{q:"<b>“The wind sees to that.”</b> 是什么意思？",
  opts:["那是风造成的／风把这事料理了","风看到了那个","风朝那个方向吹","风快要停了"],a:0,
  exp:"<b>see to something</b> ＝ 负责、搞定、料理。跟「看见」无关。<br><br>· <i>I'll see to it.</i> 我来办。<br>· <i>See to it that the door's locked.</i> 确保门锁好。<br><br>这里是拟人：风把「树」这件事料理掉了，所以岛上没树。<br><br><b>注意它有多短。</b>英语在收尾时特别喜欢用一个极短的句子把前面一长串具体描述一锤定音——段 1 白墙、段 2 宝塔顶、段 3 酒心，全是同一个手法。你已经撞见第四次了。"}},

{id:"dram",x:85,y:44,icon:"🥃",label:"领地租",kind:"场景 · Collecting your rent",title:"That's you paid up for the year",
 passage:{
  en:["You made it back, then. Wet enough for you?",
      "Right — you'll be after your rent.",
      "Pop your certificate on the bar and I'll pour you your dram.",
      "Ten-year-old alright, or would you rather try something else?",
      "There you are. Water? There's a jug at the end of the bar.",
      "Slàinte. And that's you paid up for the year."],
  zh:"你回来了啊。够湿了吧？<br>好——你是来领租金的吧。<br>把证书往吧台上一放，我给你倒。<br>10 年的可以吗，还是你想换一个试试？<br>给你。要水吗？吧台那头有壶。<br>Slàinte。这样你这一年的租就付清了。",
  tip:"最后一句 <b>that's you paid up</b> —— 段 5 的 <i>that's you sorted</i>、段 1 的 <i>that's you checked in</i>，<b>第三次了</b>。现在你应该不用想就知道它什么意思。"},
 build(b){
  b.appendChild(E("h3",null,"That's you + 过去分词"));
  b.appendChild(E("div","box","<p class='zh' style='margin:0'>这是苏格兰的招牌结构，标准英语里没有：<br><br>· <i>That's you <b>sorted</b>.</i> 你这边搞定了（段 5）<br>· <i>That's you <b>checked in</b>.</i> 你登记好了（段 1）<br>· <i>That's you <b>paid up</b>.</i> 你付清了（这里）<br>· <i>That's you <b>done</b>.</i> 你完事了<br>· <i>That's us <b>finished</b>.</i> 我们弄完了<br><br><b>公式：That's + 人称 + 过去分词</b> ＝「某人这边算是完成了」。<br><br>一个礼拜在苏格兰你能听到几十次。<b>它是这一整站里回收次数最多的一句话——因为它真的就是那么常用。</b></p>"));
  b.appendChild(E("h3",null,"另外五个"));
  WM.chips(b,[
   {en:"You made it back, then.",zh:"你回来了啊。｜ make it back ＝ 成功回来（带点调侃）"},
   {en:"Wet enough for you?",zh:"够湿了吧？｜ 英式反讽，形式是问句，其实是打趣"},
   {en:"You'll be after your rent.",zh:"你是来领租金的吧。｜ be after ＝ 想要、来拿"},
   {en:"Pop it on the bar.",zh:"往吧台上一放。｜ pop ＝ 随手放（英式高频，非常随意）"},
   {en:"Would you rather try something else?",zh:"你更想试点别的吗？｜ would rather + 动词原形"},
   {en:"There you are.",zh:"给你。｜ 递东西时说，不是 here you are 也行"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>pop 这个词值得单说。</b>英国人用它表示「轻快随手地做一下」，几乎能配任何动作：<br>· <i>Pop it on the bar.</i> 随手放吧台上<br>· <i>I'll pop out for a minute.</i> 我出去一下<br>· <i>Pop your name down here.</i> 名字写这儿<br>· <i>Pop the kettle on.</i> 烧壶水<br><br>它让句子听起来<b>轻松、不郑重</b>——这正是英国人日常说话的默认调门。你要是能自然地用出一次 pop，对方会立刻觉得你「在这儿待过」。</div>"));
  b.appendChild(E("h3",null,"你要说的（三句就够）"));
  WM.dialogue(b,[
   {who:"y",en:"Made it. <mark class='k'>It's soaking out there.</mark>",zh:"回来了。外面湿透了。"},
   {who:"g",en:"Aye, it usually is. You'll be after your rent?",zh:"对，一向如此。来领租金？"},
   {who:"y",en:"<mark class='k'>Yes please. Here's my certificate.</mark>",zh:"是的，谢谢。这是我的证书。"},
   {who:"g",en:"Ten-year-old alright, or would you rather try something else?",zh:"10 年的可以吗，还是想换一个？"},
   {who:"y",en:"<mark class='k'>I'd rather try the Quarter Cask, if that's alright.</mark>",zh:"我想试试 Quarter Cask，方便的话。"},
   {who:"g",en:"No bother at all. There you are. Slàinte.",zh:"完全没问题。给你。Slàinte。"},
   {who:"y",en:"<mark class='k'>Slàinte mhath.</mark>",zh:"Slàinte mhath。"}
  ]);
  b.appendChild(E("div","box flat","<div class='small'><b>I'd rather … , if that's alright.</b> 这一句要背下来。<br><br>· <b>would rather + 动词原形</b>（不加 to）：<i>I'd rather try the Quarter Cask.</i><br>· <b>if that's alright</b> 放句尾 ＝ 「方便的话」，把一个要求软化成一个请求<br><br>你在英国点单、改主意、提要求，这一整句能用一辈子。<b>而且它完全不需要生词。</b></div>"));
 },
 check:{q:"<b>“That's you paid up for the year.”</b> 是什么意思？",
  opts:["你这一年的租金付清了","你今年被收费了","你要为这一年付款","你的账户被冻结了"],a:0,
  exp:"<b>That's + 人称 + 过去分词</b> ＝ 苏格兰的「某人这边算完成了」。<br><br>你已经撞见三次了：<br>· 段 5 <i>That's you <b>sorted</b></i>（杯子给你了）<br>· 段 1 <i>That's you <b>checked in</b></i>（登记好了）<br>· 这里 <i>That's you <b>paid up</b></i>（付清了）<br><br><b>注意方向：付租金的是酒厂，不是你。</b>你是地主，他们欠你一杯酒——倒完这杯，他们这一年的租就付清了。所以 <i>that's you paid up</i> 说的是「你（作为收租方）这一年的事了结了」。<br><br>这个玩笑正是 Friends of Laphroaig 的全部乐趣所在。"}},

{id:"notes",x:14,y:88,icon:"📓",label:"本场笔记",kind:"写作 · Your notes for this scene",title:"这一场，你自己写",
